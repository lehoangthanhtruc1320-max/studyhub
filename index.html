<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Nền tảng học tập chung</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome cho các icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f472b6',
                            400: '#ec4899',
                            500: '#db2777',
                            600: '#be185d',
                            700: '#9d174d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pink-50/50 min-h-screen flex flex-col font-sans text-slate-700">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-pink-100 sticky top-0 z-50 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-pink-100 rounded-xl flex items-center justify-center text-pink-600 font-bold">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-base font-bold text-slate-800 tracking-wide">StudyHub</h1>
            </div>

            <!-- Khu vực trạng thái tài khoản đăng nhập -->
            <div id="auth-container">
                <button onclick="loginWithGoogle()" class="bg-pink-100 hover:bg-pink-200 text-pink-700 text-xs px-3.5 py-2 rounded-xl font-medium transition flex items-center space-x-2 border border-pink-200 shadow-2xs">
                    <i class="fa-brands fa-google"></i>
                    <span>Đăng nhập Google</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content (Mở rộng max-w-6xl để form dài rộng ra) -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        
        <!-- FORM TẠO BÀI HỌC / CHUYÊN ĐỀ MỚI (CHỈ HIỆN KHI ĐÃ ĐĂNG NHẬP) -->
        <div id="add-form-wrapper" class="bg-white p-6 rounded-2xl shadow-xs border border-pink-100 hidden">
            <h3 class="text-sm font-bold text-pink-600 mb-4 flex items-center">
                <i class="fa-solid fa-plus-circle mr-1.5"></i> Đóng góp chuyên đề học tập
            </h3>
            <form id="add-category-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tên bài học / Chuyên đề:</label>
                        <input type="text" id="input-title" required placeholder="VD: Cách bấm máy tích có hướng..." class="w-full px-3 py-2.5 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50/30">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Môn học (Danh mục lớn):</label>
                        <input type="text" id="input-chapter" required placeholder="VD: Chương 1, Chương 2..." class="w-full px-3 py-2.5 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50/30">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Thời lượng (phút):</label>
                        <input type="text" id="input-duration" required placeholder="VD: 15" class="w-full px-3 py-2.5 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50/30">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Đường dẫn tài liệu (URL file/Drive):</label>
                    <input type="url" id="input-link" placeholder="https://..." class="w-full px-3 py-2.5 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50/30">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 rounded-xl transition shadow-xs text-sm">
                    Đăng bài học
                </button>
            </form>
        </div>

        <!-- THÔNG BÁO YÊU CẦU ĐĂNG NHẬP ĐỂ TẠO BÀI -->
        <div id="login-required-banner" class="bg-white p-5 rounded-2xl border border-pink-100 text-center shadow-xs">
            <p class="text-xs text-slate-600 mb-2">Bạn cần đăng nhập tài khoản Google để có thể đóng góp chuyên đề học tập mới.</p>
            <button onclick="loginWithGoogle()" class="bg-pink-600 hover:bg-pink-700 text-white text-xs px-4 py-2.5 rounded-xl font-medium transition shadow-xs inline-flex items-center space-x-1.5">
                <i class="fa-brands fa-google"></i>
                <span>Đăng nhập ngay</span>
            </button>
        </div>

        <!-- DANH SÁCH BÀI HỌC -->
        <div>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Danh sách bài học</h3>
            <div id="categories-container" class="space-y-4">
                <!-- Nội dung danh sách theo chương được render tự động -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-pink-100 py-4 mt-auto text-center">
        <p class="text-xs text-slate-400">StudyHub Community Platform &copy; 2026</p>
    </footer>

    <!-- Firebase SDK và Logic xử lý -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Cấu hình Firebase chuẩn xác của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDXbgxBODiVDXk07XU4KhHe2HM-BZf3Gs",
            authDomain: "studyhub-ac686.firebaseapp.com",
            projectId: "studyhub-ac686",
            storageBucket: "studyhub-ac686.firebasestorage.app",
            messagingSenderId: "814449733460",
            appId: "1:814449733460:web:a8db659ea294b28659a2c1",
            measurementId: "G-30T7XC5EES"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // Xử lý đăng nhập Google
        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Lỗi đăng nhập:", error);
                alert("Không thể đăng nhập bằng Google. Hãy chắc chắn rằng bạn đã bật Google Provider trong Firebase Console!");
            }
        };

        // Xử lý đăng xuất
        window.logout = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Lỗi đăng xuất:", error);
            }
        };

        // Theo dõi trạng thái đăng nhập của người dùng
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authContainer = document.getElementById('auth-container');
            const addFormWrapper = document.getElementById('add-form-wrapper');
            const loginBanner = document.getElementById('login-required-banner');

            if (user) {
                authContainer.innerHTML = `
                    <div class="flex items-center space-x-2 bg-pink-50 px-3 py-1.5 rounded-xl border border-pink-200">
                        <img src="${user.photoURL || 'https://via.placeholder.com/32'}" alt="Avatar" class="w-6 h-6 rounded-full object-cover">
                        <span class="text-xs font-semibold text-slate-700 hidden sm:inline">${user.displayName}</span>
                        <button onclick="logout()" class="text-xs text-rose-500 hover:text-rose-700 font-medium ml-1" title="Đăng xuất">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                `;
                addFormWrapper.classList.remove('hidden');
                loginBanner.classList.add('hidden');
            } else {
                authContainer.innerHTML = `
                    <button onclick="loginWithGoogle()" class="bg-pink-100 hover:bg-pink-200 text-pink-700 text-xs px-3.5 py-2 rounded-xl font-medium transition flex items-center space-x-2 border border-pink-200">
                        <i class="fa-brands fa-google"></i>
                        <span>Đăng nhập Google</span>
                    </button>
                `;
                addFormWrapper.classList.add('hidden');
                loginBanner.classList.remove('hidden');
            }
            loadCategories();
        });

        // Tải danh sách chuyên đề nhóm theo Chương từ Firestore
        async function loadCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '<p class="text-center text-pink-500 py-4 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Đang tải dữ liệu...</p>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "categories"));
                container.innerHTML = '';
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p class="text-center text-slate-400 py-4 text-xs">Chưa có chuyên đề nào được tạo. Hãy đăng nhập và đóng góp bài học đầu tiên!</p>';
                    return;
                }

                // Gom nhóm các bài học theo chương (chapter)
                const chaptersMap = {};
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const chapter = data.chapter || "Chương chung";
                    if (!chaptersMap[chapter]) {
                        chaptersMap[chapter] = [];
                    }
                    chaptersMap[chapter].push({ id: docSnap.id, ...data });
                });

                let chapterIndex = 1;
                for (const [chapterName, items] of Object.entries(chaptersMap)) {
                    const chapterId = `chapter-content-${chapterIndex}`;
                    const iconId = `chapter-icon-${chapterIndex}`;

                    let itemsHTML = '';
                    items.forEach(item => {
                        const canDelete = currentUser !== null;
                        itemsHTML += `
                            <div class="bg-white rounded-xl p-3.5 shadow-xs border border-pink-100 flex justify-between items-center transition hover:shadow-sm">
                                <div>
                                    <h5 class="font-bold text-slate-800 text-sm">${item.title}</h5>
                                    <p class="text-xs text-slate-500 mt-0.5">
                                        <span><i class="fa-regular fa-clock mr-1"></i>Thời lượng: ${item.duration} phút</span>
                                        <span class="mx-1.5">•</span>
                                        <span class="text-pink-600 font-medium">Người đăng: ${item.author || 'Thành viên'}</span>
                                    </p>
                                </div>
                                <div class="flex items-center space-x-2">
                                    ${item.fileLink ? `<a href="${item.fileLink}" target="_blank" class="bg-pink-600 hover:bg-pink-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center shadow-xs"><i class="fa-solid fa-download mr-1.5"></i> Xem tài liệu</a>` : ''}
                                    ${canDelete ? `
                                        <button onclick="deleteCategory('${item.id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-600 text-xs px-2.5 py-1.5 rounded-lg font-medium transition" title="Xóa bài học">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });

                    const chapterHTML = `
                        <div class="bg-white rounded-2xl shadow-xs border border-pink-100 overflow-hidden">
                            <!-- Tiêu đề Chương (Bấm vào để ẩn/hiện danh sách con) -->
                            <div onclick="toggleChapter('${chapterId}', '${iconId}')" class="p-4 bg-pink-50/60 hover:bg-pink-100/50 cursor-pointer flex justify-between items-center transition">
                                <div class="flex items-center space-x-3">
                                    <div class="w-8 h-8 bg-pink-100 rounded-lg flex items-center justify-center text-pink-600 font-bold">
                                        <i class="fa-solid fa-book-open text-sm"></i>
                                    </div>
                                    <h4 class="font-bold text-slate-800 text-sm md:text-base">${chapterName}</h4>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <span class="text-xs bg-pink-100 text-pink-700 font-semibold px-2.5 py-1 rounded-full">${items.length} bài học</span>
                                    <i id="${iconId}" class="fa-solid fa-chevron-down text-pink-500 transition-transform duration-300 text-xs"></i>
                                </div>
                            </div>
                            <!-- Danh sách các mục con (Mặc định ẩn, bấm vào mới hiện ra) -->
                            <div id="${chapterId}" class="hidden p-3 space-y-2.5 bg-pink-50/20 border-t border-pink-100">
                                ${itemsHTML}
                            </div>
                        </div>
                    `;

                    container.insertAdjacentHTML('beforeend', chapterHTML);
                    chapterIndex++;
                }

            } catch (error) {
                console.error("Lỗi tải dữ liệu: ", error);
                container.innerHTML = '<p class="text-center text-rose-500 py-4 text-xs">Lỗi kết nối cơ sở dữ liệu!</p>';
            }
        };

        // Xóa chuyên đề
        window.deleteCategory = async function(docId) {
            if (confirm("Bạn có chắc chắn muốn xóa bài học này không?")) {
                try {
                    await deleteDoc(doc(db, "categories", docId));
                    loadCategories();
                } catch (error) {
                    console.error("Lỗi khi xóa:", error);
                    alert("Không thể xóa bài học này!");
                }
            }
        };

        // Gửi form thêm chuyên đề mới
        window.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('add-category-form');
            if(form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!currentUser) {
                        alert("Vui lòng đăng nhập trước khi đóng góp bài học!");
                        return;
                    }

                    const title = document.getElementById('input-title').value;
                    const chapter = document.getElementById('input-chapter').value;
                    const duration = document.getElementById('input-duration').value;
                    const fileLink = document.getElementById('input-link').value;

                    const submitBtn = document.getElementById('submit-btn');
                    submitBtn.disabled = true;
                    submitBtn.innerText = "Đang đăng...";

                    try {
                        await addDoc(collection(db, "categories"), {
                            title: title,
                            chapter: chapter,
                            duration: duration,
                            fileLink: fileLink,
                            userId: currentUser.uid,
                            author: currentUser.displayName || "Thành viên",
                            createdAt: new Date()
                        });
                        
                        form.reset();
                        loadCategories();
                    } catch (error) {
                        console.error("Lỗi khi thêm: ", error);
                        alert("Có lỗi xảy ra, vui lòng thử lại!");
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Đăng bài học";
                    }
                });
            }
        });
    </script>

    <!-- Script Accordion cho Chương -->
    <script>
        function toggleChapter(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }
    </script>
</body>
</html>
