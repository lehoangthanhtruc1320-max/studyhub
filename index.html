<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Nền tảng chia sẻ học tập</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs bản Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDJxbgxBOdiVDXk07XU4KhHe2HM-BZf3Gs",
            authDomain: "studyhub-ac686.firebaseapp.com",
            projectId: "studyhub-ac686",
            storageBucket: "studyhub-ac686.firebasestorage.app",
            messagingSenderId: "814449733460",
            appId: "1:814449733460:web:5335822abe5bea0659a2c1",
            measurementId: "G-LZC96XFTCD"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        window.currentUser = null;

        window.loginWithGoogle = async function() {
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                console.error("Lỗi đăng nhập:", error);
                alert("Đăng nhập thất bại: " + error.message);
            }
        };

        window.logout = async function() {
            try {
                await auth.signOut();
            } catch (error) {
                console.error("Lỗi đăng xuất:", error);
            }
        };

        auth.onAuthStateChanged((user) => {
            window.currentUser = user;
            const loginSection = document.getElementById("login-section");
            const authContainer = document.getElementById("auth-container");
            const contributeForm = document.getElementById("contribute-form-container");

            if (user) {
                loginSection.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${user.photoURL || 'https://via.placeholder.com/40'}" alt="Avatar" class="w-9 h-9 rounded-full border border-indigo-500">
                        <div class="text-left hidden sm:block">
                            <p class="text-sm font-semibold text-gray-800">${user.displayName}</p>
                            <p class="text-xs text-gray-500">${user.email}</p>
                        </div>
                        <button onclick="logout()" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg text-sm font-medium transition">Đăng xuất</button>
                    </div>
                `;
                if (authContainer) authContainer.classList.add("hidden");
                if (contributeForm) contributeForm.classList.remove("hidden");
            } else {
                loginSection.innerHTML = `
                    <button onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 transition shadow-sm">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.24 10.285V14.2h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0 5.48 0 0 5.48 0 12s5.48 12 12.24 12c7.058 0 11.733-4.96 11.733-11.95 0-.828-.086-1.45-.19-2.065H12.24z"/></svg>
                        <span>Đăng nhập Google</span>
                    </button>
                `;
                if (authContainer) authContainer.classList.remove("hidden");
                if (contributeForm) contributeForm.classList.add("hidden");
            }
            loadLessons();
        });

        window.handleContribute = async function(e) {
            e.preventDefault();
            if (!window.currentUser) {
                alert("Vui lòng đăng nhập Google để đóng góp!");
                return;
            }

            const title = document.getElementById("lesson-title").value.trim();
            const subject = document.getElementById("lesson-subject").value.trim();
            const time = document.getElementById("lesson-time").value;
            const fileUrl = document.getElementById("lesson-file").value.trim();

            try {
                await db.collection("lessons").add({
                    title: title,
                    subject: subject || "Chung",
                    time: time ? time + " phút" : "15 phút",
                    fileUrl: fileUrl,
                    authorName: window.currentUser.displayName || "Thành viên",
                    authorEmail: window.currentUser.email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Đóng góp chuyên đề thành công!");
                document.getElementById("contribute-form").reset();
                loadLessons();
            } catch (error) {
                console.error("Lỗi khi thêm bài học:", error);
                alert("Có lỗi xảy ra, vui lòng thử lại!");
            }
        };

        window.deleteLesson = async function(id) {
            if (!window.currentUser) {
                alert("Bạn cần đăng nhập để thực hiện hành động này!");
                return;
            }
            if (confirm("Bạn có chắc chắn muốn xóa bài học này không?")) {
                try {
                    await db.collection("lessons").doc(id).delete();
                    alert("Đã xóa bài học thành công!");
                    loadLessons();
                } catch (error) {
                    console.error("Lỗi khi xóa:", error);
                    alert("Không thể xóa bài học này. Vui lòng thử lại!");
                }
            }
        };

        // Hàm tải và nhóm các bài học theo danh mục lớn (Môn học)
        window.loadLessons = async function() {
            const container = document.getElementById("lessons-container");
            container.innerHTML = `<p class="text-gray-500 text-sm py-4 text-center">Đang tải danh sách bài học...</p>`;

            try {
                const snapshot = await db.collection("lessons").orderBy("createdAt", "desc").get();
                
                if (snapshot.empty) {
                    container.innerHTML = `<p class="text-gray-500 text-sm py-4 text-center bg-white border border-gray-200 rounded-xl p-6">Chưa có bài học nào được đóng góp.</p>`;
                    return;
                }

                // Gom nhóm các bài học theo subject (môn học lớn)
                const grouped = {};
                snapshot.forEach((docSnap) => {
                    const data = docSnap.val ? docSnap.val() : docSnap.data();
                    const id = docSnap.id;
                    const subject = (data.subject || "Chung").trim();
                    
                    if (!grouped[subject]) {
                        grouped[subject] = [];
                    }
                    grouped[subject].push({ id, ...data });
                });

                let html = "";
                // Tạo giao diện Danh mục lớn bao bên ngoài, mục nhỏ bên trong
                for (const [subject, items] of Object.entries(grouped)) {
                    html += `
                        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden mb-6">
                            <!-- Tiêu đề Danh mục lớn -->
                            <div class="bg-indigo-50 border-b border-indigo-100 px-6 py-4 flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="bg-indigo-600 text-white p-2 rounded-lg">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    </div>
                                    <h3 class="text-lg font-bold text-indigo-900">${subject}</h3>
                                </div>
                                <span class="bg-indigo-200 text-indigo-800 text-xs font-semibold px-2.5 py-1 rounded-full">${items.length} bài học</span>
                            </div>

                            <!-- Danh sách các mục nhỏ bên trong -->
                            <div class="divide-y divide-gray-100">
                    `;

                    items.forEach((lesson) => {
                        const canDelete = window.currentUser && (lesson.authorEmail === window.currentUser.email);
                        html += `
                            <div class="px-6 py-4 flex items-center justify-between hover:bg-gray-50 transition">
                                <div class="space-y-1">
                                    <h4 class="font-semibold text-gray-800 text-base">${lesson.title}</h4>
                                    <p class="text-xs text-gray-500">Thời lượng: ${lesson.time} • Người đăng: <span class="font-medium text-gray-700">${lesson.authorName}</span></p>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <a href="${lesson.fileUrl}" target="_blank" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3.5 py-2 rounded-lg font-medium transition flex items-center space-x-1.5 shadow-sm">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                        <span>Xem tài liệu</span>
                                    </a>
                                    ${canDelete ? `
                                        <button onclick="deleteLesson('${lesson.id}')" title="Xóa bài học này" class="bg-red-50 hover:bg-red-100 text-red-600 p-2 rounded-lg transition">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            } catch (error) {
                console.error("Lỗi tải bài học:", error);
                container.innerHTML = `<p class="text-red-500 text-sm py-4 text-center">Không thể tải danh sách bài học.</p>`;
            }
        };
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <h1 class="text-xl font-bold text-gray-800">StudyHub</h1>
            </div>
            <div id="login-section"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        
        <div id="auth-container" class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 text-center space-y-3">
            <p class="text-indigo-900 font-medium">Bạn cần đăng nhập tài khoản Google để có thể đóng góp chuyên đề học tập mới.</p>
            <button onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-sm inline-flex items-center space-x-2">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.24 10.285V14.2h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0 5.48 0 0 5.48 0 12s5.48 12 12.24 12c7.058 0 11.733-4.96 11.733-11.95 0-.828-.086-1.45-.19-2.065H12.24z"/></svg>
                <span>Đăng nhập ngay</span>
            </button>
        </div>

        <div id="contribute-form-container" class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm hidden">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Đóng góp chuyên đề học tập</h3>
            <form id="contribute-form" onsubmit="handleContribute(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Tên bài học / Chuyên đề</label>
                        <input type="text" id="lesson-title" required placeholder="VD: Khảo sát hàm số" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Môn học (Danh mục lớn)</label>
                        <input type="text" id="lesson-subject" required placeholder="VD: Toán, Sinh học, Tiếng Anh..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Thời lượng (phút)</label>
                        <input type="number" id="lesson-time" placeholder="VD: 15" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Đường dẫn tài liệu (URL file/Drive)</label>
                    <input type="url" id="lesson-file" required placeholder="https://..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-sm">Đăng bài học</button>
                </div>
            </form>
        </div>

        <div class="space-y-3">
            <h3 class="text-lg font-bold text-gray-800">DANH SÁCH BÀI HỌC CỘNG ĐỒNG</h3>
            <div id="lessons-container" class="space-y-3"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500 mt-10">
        StudyHub Community Platform &copy; 2026
    </footer>

</body>
</html>
