<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Nền tảng học tập cộng đồng</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome cho các icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-pink-50 min-h-screen flex flex-col font-sans text-slate-800">

    <!-- Header -->
    <header class="bg-pink-500 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
                <h1 class="text-lg font-bold">StudyHub Community</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        
        <!-- Tiêu đề trang -->
        <div class="text-center py-2">
            <h2 class="text-xl font-extrabold text-pink-600">Tự Học - Tự Lập - Tự Do!</h2>
        </div>

        <!-- FORM TẠO CHUYÊN ĐỀ MỚI TRỰC TIẾP TRÊN WEB -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-pink-200">
            <h3 class="text-md font-bold text-pink-700 mb-3"><i class="fa-solid fa-plus-circle mr-1"></i> Tạo chuyên đề / Bài học mới</h3>
            <form id="add-category-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tên chuyên đề:</label>
                    <input type="text" id="input-title" required placeholder="VD: [2K10] CHUYÊN ĐỀ HÓA HỌC 11" class="w-full px-3 py-2 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50/30">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Thời lượng / Số bài:</label>
                        <input type="text" id="input-duration" required placeholder="VD: 0/15 • 25 giờ 30 phút" class="w-full px-3 py-2 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50/30">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Link tài liệu Google Drive:</label>
                        <input type="url" id="input-link" placeholder="https://drive.google.com/..." class="w-full px-3 py-2 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50/30">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Mô tả / Chi tiết bài học:</label>
                    <textarea id="input-desc" rows="2" placeholder="VD: Tổng hợp các dạng bài tập trọng tâm..." class="w-full px-3 py-2 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 bg-pink-50/30"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-2.5 rounded-xl transition shadow-sm text-sm">
                    Tạo chuyên đề mới
                </button>
            </form>
        </div>

        <!-- DANH SÁCH CHUYÊN ĐỀ TẢI TỪ FIREBASE -->
        <div>
            <h3 class="text-md font-bold text-slate-700 uppercase tracking-wider mb-3">Danh sách bài học</h3>
            <div id="categories-container">
                <!-- Nội dung sẽ được render tự động từ Firestore -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-pink-100 py-4 mt-auto">
        <div class="max-w-4xl mx-auto px-4 grid grid-cols-2 gap-3">
            <a href="#" class="flex items-center justify-center space-x-2 bg-pink-100 hover:bg-pink-200 text-pink-700 py-3 rounded-xl font-semibold transition border border-pink-200">
                <i class="fa-brands fa-facebook text-lg"></i>
                <span>Facebook (+2.1K)</span>
            </a>
            <a href="#" class="flex items-center justify-center space-x-2 bg-pink-100 hover:bg-pink-200 text-pink-700 py-3 rounded-xl font-semibold transition border border-pink-200">
                <i class="fa-brands fa-youtube text-lg"></i>
                <span>YouTube (+1.6M)</span>
            </a>
        </div>
    </footer>

    <!-- Firebase SDK và Logic xử lý -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyDXbgxBODiVDXk07XU4KhHe2HM-BZf3Gs",
            authDomain: "studyhub-ac686.firebaseapp.com",
            projectId: "studyhub-ac686",
            storageBucket: "studyhub-ac686.appspot.com",
            messagingSenderId: "814449733460",
            appId: "1:814449733460:web:a8db659ea294b28659a2c1",
            measurementId: "G-30T7XC5EES"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Hàm tải danh sách chuyên đề từ Firestore lên giao diện
        async function loadCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '<p class="text-center text-pink-500 py-4"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</p>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "categories"));
                container.innerHTML = '';
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p class="text-center text-slate-500 py-4">Chưa có chuyên đề nào. Hãy tạo mới bên trên!</p>';
                    return;
                }

                let index = 1;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const categoryId = `cat-${index}`;
                    
                    const itemHTML = `
                        <div class="bg-pink-100 rounded-2xl p-4 shadow-sm border border-pink-200 transition hover:shadow-md cursor-pointer mb-3" onclick="toggleAccordion('${categoryId}', 'icon-${index}')">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h4 class="font-bold text-pink-900 text-sm md:text-base">${data.title || 'Chuyên đề học tập'}</h4>
                                    <p class="text-xs text-pink-700 mt-1">${data.duration || '0 bài học • 0 phút'}</p>
                                </div>
                                <div class="flex items-center space-x-3">
                                    ${data.fileLink ? `<a href="${data.fileLink}" target="_blank" onclick="event.stopPropagation()" class="bg-pink-600 hover:bg-pink-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition"><i class="fa-solid fa-download mr-1"></i> Tài liệu</a>` : ''}
                                    <i id="icon-${index}" class="fa-solid fa-chevron-down text-pink-700 transition-transform duration-300"></i>
                                </div>
                            </div>
                            <div id="${categoryId}" class="hidden mt-3 pt-3 border-t border-pink-200 text-sm text-slate-700 space-y-2">
                                <p>• <b>Mô tả/Nội dung:</b> ${data.description || 'Đang cập nhật nội dung chi tiết cho chuyên đề này...'}</p>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', itemHTML);
                    index++;
                });
            } catch (error) {
                console.error("Lỗi tải dữ liệu: ", error);
                container.innerHTML = '<p class="text-center text-red-500 py-4">Lỗi kết nối cơ sở dữ liệu!</p>';
            }
        }

        // Xử lý sự kiện submit Form thêm chuyên đề trực tiếp
        window.addEventListener('DOMContentLoaded', () => {
            loadCategories();

            const form = document.getElementById('add-category-form');
            if(form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const title = document.getElementById('input-title').value;
                    const duration = document.getElementById('input-duration').value;
                    const fileLink = document.getElementById('input-link').value;
                    const description = document.getElementById('input-desc').value;

                    const submitBtn = document.getElementById('submit-btn');
                    submitBtn.disabled = true;
                    submitBtn.innerText = "Đang lưu...";

                    try {
                        await addDoc(collection(db, "categories"), {
                            title: title,
                            duration: duration,
                            fileLink: fileLink,
                            description: description,
                            createdAt: new Date()
                        });
                        
                        alert("Thêm chuyên đề thành công!");
                        form.reset();
                        loadCategories(); // Tải lại danh sách ngay lập tức
                    } catch (error) {
                        console.error("Lỗi khi thêm: ", error);
                        alert("Có lỗi xảy ra, vui lòng thử lại!");
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Tạo chuyên đề mới";
                    }
                });
            }
        });
    </script>

    <!-- Hàm mở rộng/thu gọn Accordion -->
    <script>
        function toggleAccordion(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }
    </script>
</body>
</html>
