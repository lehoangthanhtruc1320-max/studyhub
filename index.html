<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Nền tảng học tập & thảo luận</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">StudyHub</h1>
                    <p class="text-xs text-slate-400">Không gian học tập & kết nối</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button onclick="openModal('folderModal')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 py-2 rounded-lg font-medium text-sm transition flex items-center space-x-2">
                    <i class="fa-solid fa-folder-plus"></i>
                    <span>Tạo thư mục mới</span>
                </button>
                <div class="flex items-center space-x-2 border-l pl-4 border-slate-200">
                    <div class="w-9 h-9 rounded-full bg-violet-100 text-violet-600 font-semibold flex items-center justify-center text-sm">
                        TR
                    </div>
                    <span class="text-sm font-medium hidden sm:inline">Thanh Trúc</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar Navigation / Thư mục -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-2">Thư mục học tập</h2>
                <nav id="folderList" class="space-y-1">
                    <!-- Danh sách thư mục sẽ được render tự động -->
                </nav>
            </div>

            <div class="bg-gradient-to-br from-indigo-900 to-violet-900 p-5 rounded-2xl text-white shadow-lg shadow-indigo-100">
                <h3 class="font-semibold text-base mb-1">Góc chia sẻ</h3>
                <p class="text-xs text-indigo-200 mb-4 leading-relaxed">Nơi mọi người cùng nhau trao đổi bài tập, tài liệu và thắc mắc học tập.</p>
                <button onclick="switchTab('community')" class="w-full bg-white text-indigo-900 hover:bg-indigo-50 py-2 rounded-xl text-sm font-semibold transition shadow-sm">
                    Vào phòng thảo luận
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="lg:col-span-3 space-y-6">
            
            <!-- Tab Controls & Search -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex space-x-2 w-full sm:w-auto">
                    <button onclick="switchTab('materials')" id="btnMaterials" class="flex-1 sm:flex-none px-5 py-2 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white shadow-sm shadow-indigo-100">
                        <i class="fa-solid fa-file-lines mr-2"></i>Tài liệu & Thư mục
                    </button>
                    <button onclick="switchTab('community')" id="btnCommunity" class="flex-1 sm:flex-none px-5 py-2 rounded-xl text-sm font-semibold transition text-slate-600 hover:bg-slate-100">
                        <i class="fa-solid fa-comments mr-2"></i>Thảo luận chung
                    </button>
                </div>

                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Tìm kiếm tài liệu, thảo luận..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Tab 1: Materials & Folders View -->
            <div id="materialsTab" class="space-y-6">
                <div class="flex items-center justify-between">
                    <h3 id="currentFolderTitle" class="text-lg font-bold text-slate-800">Tất cả tài liệu</h3>
                    <button onclick="openModal('uploadModal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm shadow-indigo-100 flex items-center space-x-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Đăng tài liệu</span>
                    </button>
                </div>

                <div id="materialGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Tài liệu sẽ được render ở đây -->
                </div>
            </div>

            <!-- Tab 2: Community Discussion View -->
            <div id="communityTab" class="space-y-6 hidden">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-base">Đăng câu hỏi hoặc chia sẻ suy nghĩ</h3>
                    <textarea id="postContent" rows="3" placeholder="Bạn muốn thảo luận vấn đề gì hôm nay? (Ví dụ: Bài tập toán hình 11, mẹo học sinh học...)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition resize-none"></textarea>
                    <div class="flex justify-between items-center">
                        <div class="flex space-x-2 text-slate-400 text-sm">
                            <span class="flex items-center space-x-1 cursor-pointer hover:text-indigo-600"><i class="fa-solid fa-image"></i> <span>Ảnh</span></span>
                        </div>
                        <button onclick="createPost()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-xl text-sm font-semibold transition shadow-sm shadow-indigo-100">
                            Đăng bài
                        </button>
                    </div>
                </div>

                <div id="postsList" class="space-y-4">
                    <!-- Danh sách bài đăng thảo luận -->
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Tạo Thư Mục -->
    <div id="folderModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800">Tạo thư mục môn học mới</h3>
                <button onclick="closeModal('folderModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Tên thư mục / Môn học</label>
                <input type="text" id="newFolderName" placeholder="Ví dụ: Toán 11, Tiếng Anh, Sinh học..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeModal('folderModal')" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100">Hủy</button>
                <button onclick="addNewFolder()" class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm shadow-indigo-100">Tạo thư mục</button>
            </div>
        </div>
    </div>

    <!-- Modal Đăng Tài Liệu -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800">Chia sẻ tài liệu học tập</h3>
                <button onclick="closeModal('uploadModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Tiêu đề tài liệu</label>
                    <input type="text" id="docTitle" placeholder="Ví dụ: Tổng hợp công thức Đạo hàm..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Chọn thư mục</label>
                    <select id="docFolderSelect" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                        <!-- Danh sách thư mục option -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Mô tả hoặc Link tài liệu</label>
                    <textarea id="docDesc" rows="3" placeholder="Nhập tóm tắt nội dung hoặc dán liên kết tài liệu vào đây..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 resize-none"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeModal('uploadModal')" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100">Hủy</button>
                <button onclick="uploadDocument()" class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm shadow-indigo-100">Tải lên</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Xử Lý Giao Diện & Dữ Liệu -->
    <script>
        // Dữ liệu mẫu ban đầu
        let folders = [
            { id: 'all', name: 'Tất cả tài liệu', icon: 'fa-folder-open' },
            { id: 'math', name: 'Toán học 11', icon: 'fa-calculator' },
            { id: 'biology', name: 'Sinh học', icon: 'fa-dna' },
            { id: 'english', name: 'Tiếng Anh', icon: 'fa-language' },
            { id: 'it', name: 'Lập trình Python', icon: 'fa-code' }
        ];

        let materials = [
            { id: 1, title: 'Đề kiểm tra cuối kỳ II môn Toán 11', folder: 'math', desc: 'Bộ đề ôn tập bám sát chương trình mới kèm lời giải chi tiết.', author: 'Thanh Trúc', date: 'Hôm qua' },
            { id: 2, title: 'Tóm tắt lý thuyết Hô hấp ở thực vật', folder: 'biology', desc: 'Sơ đồ tư duy ngắn gọn phần sinh học tế bào và trao đổi chất.', author: 'Thanh Trúc', date: '3 ngày trước' },
            { id: 3, title: 'Bài tập luyện viết câu tiếng Anh nâng cao', folder: 'english', desc: 'Tổng hợp cấu trúc câu viết lại hay gặp trong các kỳ thi.', author: 'Minh Thư', date: 'Tuần trước' },
            { id: 4, title: 'Cơ bản về hàm Python và biến cục bộ', folder: 'it', desc: 'Tài liệu hướng dẫn định nghĩa hàm def và phạm vi biến.', author: 'Hoàng Long', date: '2 tuần trước' }
        ];

        let posts = [
            { id: 1, author: 'Thanh Trúc', time: '2 giờ trước', content: 'Mọi người có tài liệu phần hình học không gian lớp 11 phần khoảng cách không ạ? Cho mình xin tham khảo với!', comments: [ { author: 'Minh Thư', text: 'Cậu xem lại mục Toán học 11 nhé, mình vừa up phần tổng hợp đấy!' } ] }
        ];

        let currentFolder = 'all';

        // Khởi tạo hiển thị trang web
        function initApp() {
            renderFolders();
            renderMaterials();
            renderPosts();
            updateFolderSelect();
        }

        function renderFolders() {
            const list = document.getElementById('folderList');
            list.innerHTML = folders.map(f => `
                <button onclick="selectFolder('${f.id}')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition ${currentFolder === f.id ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid ${f.icon || 'fa-folder'} text-base"></i>
                        <span>${f.name}</span>
                    </div>
                    <span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">
                        ${f.id === 'all' ? materials.length : materials.filter(m => m.folder === f.id).length}
                    </span>
                </button>
            `).join('');
        }

        function selectFolder(folderId) {
            currentFolder = folderId;
            const folder = folders.find(f => f.id === folderId);
            document.getElementById('currentFolderTitle').innerText = folder ? folder.name : 'Tài liệu';
            renderFolders();
            renderMaterials();
        }

        function renderMaterials(filterKeyword = '') {
            const grid = document.getElementById('materialGrid');
            let filtered = currentFolder === 'all' ? materials : materials.filter(m => m.folder === currentFolder);
            
            if(filterKeyword) {
                filtered = filtered.filter(m => m.title.toLowerCase().includes(filterKeyword.toLowerCase()) || m.desc.toLowerCase().includes(filterKeyword.toLowerCase()));
            }

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-400 text-sm">Chưa có tài liệu nào trong thư mục này.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(m => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition space-y-3 flex flex-col justify-between">
                    <div class="space-y-2">
                        <div class="flex items-start justify-between">
                            <span class="text-xs font-medium px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-600">${getFolderName(m.folder)}</span>
                            <span class="text-xs text-slate-400">${m.date}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-base">${m.title}</h4>
                        <p class="text-xs text-slate-500 leading-relaxed">${m.desc}</p>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 text-xs">
                        <span class="text-slate-400"><i class="fa-solid fa-user-circle mr-1"></i> ${m.author}</span>
                        <button onclick="alert('Đang tải xuống tài liệu...')" class="text-indigo-600 hover:text-indigo-700 font-semibold flex items-center space-x-1">
                            <span>Xem chi tiết</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getFolderName(folderId) {
            const f = folders.find(item => item.id === folderId);
            return f ? f.name : 'Chung';
        }

        function renderPosts() {
            const container = document.getElementById('postsList');
            container.innerHTML = posts.map(p => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-600 font-semibold flex items-center justify-center text-sm">
                                ${p.author.charAt(0)}
                            </div>
                            <div>
                                <h5 class="font-semibold text-sm text-slate-800">${p.author}</h5>
                                <span class="text-xs text-slate-400">${p.time}</span>
                            </div>
                        </div>
                    </div>
                    <p class="text-sm text-slate-700 leading-relaxed">${p.content}</p>
                    
                    <div class="border-t border-slate-100 pt-3 space-y-3">
                        <div class="space-y-2">
                            ${p.comments.map(c => `
                                <div class="bg-slate-50 p-3 rounded-xl text-xs space-y-1">
                                    <span class="font-semibold text-slate-700">${c.author}</span>
                                    <p class="text-slate-600">${c.text}</p>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex space-x-2">
                            <input type="text" id="commentInput_${p.id}" placeholder="Viết bình luận..." class="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <button onclick="addComment(${p.id})" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-semibold hover:bg-indigo-700">Gửi</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tabName) {
            const matTab = document.getElementById('materialsTab');
            const comTab = document.getElementById('communityTab');
            const btnMat = document.getElementById('btnMaterials');
            const btnCom = document.getElementById('btnCommunity');

            if(tabName === 'materials') {
                matTab.classList.remove('hidden');
                comTab.classList.add('hidden');
                btnMat.className = "flex-1 sm:flex-none px-5 py-2 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white shadow-sm shadow-indigo-100";
                btnCom.className = "flex-1 sm:flex-none px-5 py-2 rounded-xl text-sm font-semibold transition text-slate-600 hover:bg-slate-100";
            } else {
                matTab.classList.add('hidden');
                comTab.classList.remove('hidden');
                btnCom.className = "flex-1 sm:flex-none px-5 py-2 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white shadow-sm shadow-indigo-100";
                btnMat.className = "flex-1 sm:flex-none px-5 py-2 rounded-xl text-sm font-semibold transition text-slate-600 hover:bg-slate-100";
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        function updateFolderSelect() {
            const select = document.getElementById('docFolderSelect');
            select.innerHTML = folders.filter(f => f.id !== 'all').map(f => `<option value="${f.id}">${f.name}</option>`).join('');
        }

        function addNewFolder() {
            const name = document.getElementById('newFolderName').value.trim();
            if(!name) return alert('Vui lòng nhập tên thư mục!');
            const id = 'folder_' + Date.now();
            folders.push({ id, name, icon: 'fa-folder' });
            document.getElementById('newFolderName').value = '';
            closeModal('folderModal');
            initApp();
        }

        function uploadDocument() {
            const title = document.getElementById('docTitle').value.trim();
            const folder = document.getElementById('docFolderSelect').value;
            const desc = document.getElementById('docDesc').value.trim();
            if(!title) return alert('Vui lòng nhập tiêu đề tài liệu!');

            materials.unshift({ id: Date.now(), title, folder, desc: desc || 'Không có mô tả', author: 'Thanh Trúc', date: 'Vừa xong' });
            document.getElementById('docTitle').value = '';
            document.getElementById('docDesc').value = '';
            closeModal('uploadModal');
            renderFolders();
            renderMaterials();
        }

        function createPost() {
            const content = document.getElementById('postContent').value.trim();
            if(!content) return alert('Vui lòng nhập nội dung bài viết!');
            posts.unshift({ id: Date.now(), author: 'Thanh Trúc', time: 'Vừa xong', content, comments: [] });
            document.getElementById('postContent').value = '';
            renderPosts();
        }

        function addComment(postId) {
            const input = document.getElementById(`commentInput_${postId}`);
            const text = input.value.trim();
            if(!text) return;
            const post = posts.find(p => p.id === postId);
            if(post) {
                post.comments.push({ author: 'Thanh Trúc', text });
                input.value = '';
                renderPosts();
            }
        }

        function handleSearch(keyword) {
            renderMaterials(keyword);
        }

        // Chạy khởi tạo khi tải xong trang
        window.onload = initApp;
    </script>
</body>
</html>
